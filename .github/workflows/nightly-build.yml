name: Nightly Build

# 推送到 main 时，仅当改动会影响 EXE 产物才触发；
# 纯文档、测试等改动不重新编译。也可在 Actions 页面手动运行。
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "packaging/**"
      - "scripts/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nightly
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly

  release:
    name: Publish Nightly Build
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          # 需要完整历史才能看出本次 push（before..head）里哪个提交真正影响了构建：
          # 深度为 1 时只能拿到 tip，文档提交排在代码提交之后会认错对象。
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: JiYuAttackNext-build
          path: dist

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          # 资产文件名用带提交哈希的显示版本，发布说明仍只写带日期的版本号。
          display="${{ needs.build.outputs.display }}"
          exe_sha256="$(sha256sum dist/JiYuAttackNext.exe | awk '{print $1}')"
          debug_sha256="$(sha256sum dist/JiYuAttackNext_Debug.exe | awk '{print $1}')"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # paths 过滤按整个 push 判定，tip 可能只是一个文档提交，
          # 真正的改动排在它前面：发布说明只记最新一个影响构建的提交。
          before="${{ github.event.before }}"
          # 提交范围：push 事件取 before..head，手动触发或首次推送退化为最后一次提交。
          range=(-1 "${GITHUB_SHA}")
          if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            range=("${before}..${GITHUB_SHA}")
          fi
          # 与 workflow 的 paths 过滤保持一致：只有改动这些路径的提交才会影响构建。
          build_paths='^(app/|packaging/|scripts/|assets/|requirements\.txt|\.github/workflows/)'
          build_commit=""
          for sha in $(git log --format=%H "${range[@]}" || true); do
            if git show --pretty=format: --name-only "${sha}" | grep -Eq "${build_paths}"; then
              build_commit="${sha}"
              break
            fi
          done
          if [[ -z "${build_commit}" ]]; then
            build_commit="${GITHUB_SHA}"
          fi
          short_sha="${build_commit::7}"
          # 这一条提交带链接，点缩写哈希可以直接跳到对应改动。
          commit_list="$(git log -1 --pretty=format:"- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${build_commit}")"
          cat > release-notes.md <<EOF
          # Nightly Build ${version}

          - **Version:** \`${version}\`
          - **Built at:** \`${built_at}\`
          - **Commit:** [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${build_commit})
          - **Workflow run:** [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Assets

          - \`JiYuAttackNext-${display}.exe\`（正常版本）
          - \`JiYuAttackNext_Debug-${display}.exe\`（调试版本，记录完整日志）

          ## SHA256

          - EXE: \`${exe_sha256}\`
          - EXE (Debug): \`${debug_sha256}\`

          ## Commits

          ${commit_list}

          EOF

      # 同一天只更新同一个预发布，跨天才删除重建：删除重建会触发一次新的
      # release 事件，仓库关注者的动态会被每日一次而不是每次推送刷屏。
      - name: Decide whether to reuse today's nightly release
        id: nightly_state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${VERSION}" != *-nightly.* ]]; then
            echo "::error::nightly 版本号缺少 -nightly.YYYYMMDD 后缀：${VERSION}"
            exit 1
          fi
          stamp="${VERSION##*-nightly.}"
          existing=""
          if gh release view nightly >/dev/null 2>&1; then
            existing="$(gh release view nightly --json name --jq '.name')"
          fi
          if [[ "${existing}" == *"${stamp}"* ]]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            echo "当天已有 ${existing}，原地更新资产与说明，不产生新的发布通知"
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "当天还没有 nightly 预发布（现有：${existing:-无}），删除旧的再重新发布"
          fi

      - name: Remove previous nightly release
        if: ${{ steps.nightly_state.outputs.reuse != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "nightly 预发布尚不存在，无需清理"
            exit 0
          fi
          gh release delete nightly --yes --cleanup-tag
          echo "已删除旧的 nightly 预发布与标签"

      # 资产名带提交哈希，每次构建都是新名字；只发两个产物时，旧名字的资产
      # 不会被子句覆盖，会一直堆在发布页上，所以复用前先清空。
      - name: Remove stale nightly assets
        if: ${{ steps.nightly_state.outputs.reuse == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
            gh release delete-asset nightly "${asset}" --yes
            echo "已删除旧资产：${asset}"
          done

      - name: Publish Nightly Build pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          # 同一天复用同一个预发布时用它替换已存在的同名资产。
          overwrite_files: true
          make_latest: false
          files: |
            dist/JiYuAttackNext-${{ needs.build.outputs.display }}.exe
            dist/JiYuAttackNext_Debug-${{ needs.build.outputs.display }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 复用当天的预发布时是原地更新，标签仍停在当天第一次构建的提交上，
      # 这里把它挪到本次提交，保证 nightly 标签与资产始终对应。
      - name: Point nightly tag at this build
        if: ${{ steps.nightly_state.outputs.reuse == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null; then
            echo "nightly 标签已指向 ${GITHUB_SHA}"
          else
            echo "::warning::nightly 标签未能移动，资产已是本次构建"
          fi
