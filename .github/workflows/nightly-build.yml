name: Nightly Build

# 推送到 main 时，仅当改动会影响 EXE 或 CLI 产物才触发；
# 纯文档、测试等改动不重新编译。也可在 Actions 页面手动运行。
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "cli/**"
      - "scripts/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nightly
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly

  release:
    name: Publish Nightly Build
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          # 需要完整历史才能列出本次 push 范围内（before..head）的全部提交；
          # 只取 1 个提交时，文档提交排在代码提交之后会让发布说明看起来像只构建了文档。
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: JiYuAttackNext-build
          path: dist

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="${{ needs.build.outputs.version }}"
          exe_sha256="$(sha256sum dist/JiYuAttackNext.exe | awk '{print $1}')"
          cli_sha256="$(sha256sum dist/JiYuAttackNext-cli.py | awk '{print $1}')"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          commit_message="$(git log -1 --pretty=%B)"
          if [[ -z "${commit_message}" ]]; then
            commit_message="（无提交说明）"
          fi
          # paths 过滤按整个 push 的 before..head 判定，tip 提交是文档也可能
          # 带着代码提交一起构建；列出范围内全部提交说明本次构建立足于哪些改动。
          before="${{ github.event.before }}"
          commit_list=""
          if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            commit_list="$(git log --pretty=format:'- `%h` %s' "${before}..${GITHUB_SHA}" || true)"
          fi
          if [[ -z "${commit_list}" ]]; then
            commit_list="$(git log -1 --pretty=format:'- `%h` %s' "${GITHUB_SHA}")"
          fi
          cat > release-notes.md <<EOF
          # Nightly Build ${version}

          - **Version:** \`${version}\`
          - **Commit:** [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Built at:** \`${built_at}\`
          - **Workflow run:** [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Assets

          - \`JiYuAttackNext.exe\`
          - \`JiYuAttackNext-cli.py\` (Python 3.13)

          ## SHA256

          - GUI: \`${exe_sha256}\`
          - CLI: \`${cli_sha256}\`

          ## Commits

          ${commit_list}

          ## Message

          \`\`\`text
          ${commit_message}
          \`\`\`
          EOF

      - name: Publish Nightly Build pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          files: |
            dist/JiYuAttackNext.exe
            dist/JiYuAttackNext-cli.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
