name: Nightly Build

# 推送到 main 时，仅当改动会影响 EXE 产物才触发；
# 纯文档、测试等改动不重新编译。也可在 Actions 页面手动运行。
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "packaging/**"
      - "scripts/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nightly
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly

  release:
    name: Publish Nightly Build
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          # 需要完整历史才能列出本次 push 范围内（before..head）的全部提交；
          # 只取 1 个提交时，文档提交排在代码提交之后会让发布说明看起来像只构建了文档。
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: JiYuAttackNext-build
          path: dist

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="${{ needs.build.outputs.version }}"
          exe_sha256="$(sha256sum dist/JiYuAttackNext.exe | awk '{print $1}')"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # paths 过滤按整个 push 的 before..head 判定，tip 提交是文档也可能
          # 带着代码提交一起构建；列出范围内全部提交说明本次构建立足于哪些改动。
          before="${{ github.event.before }}"
          commit_list=""
          if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            commit_list="$(git log --pretty=format:'- `%h` %s' "${before}..${GITHUB_SHA}" || true)"
          fi
          if [[ -z "${commit_list}" ]]; then
            commit_list="$(git log -1 --pretty=format:'- `%h` %s' "${GITHUB_SHA}")"
          fi
          cat > release-notes.md <<EOF
          # Nightly Build ${version}

          - **Version:** \`${version}\`
          - **Built at:** \`${built_at}\`
          - **Commit:** [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Workflow run:** [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Assets

          - \`JiYuAttackNext.exe\`

          ## SHA256

          - EXE: \`${exe_sha256}\`

          ## Commits

          ${commit_list}
          EOF

      # 同一天只更新同一个预发布，跨天才删除重建：删除重建会触发一次新的
      # release 事件，仓库关注者的动态会被每日一次而不是每次推送刷屏。
      - name: Decide whether to reuse today's nightly release
        id: nightly_state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${VERSION}" != *-nightly.* ]]; then
            echo "::error::nightly 版本号缺少 -nightly.YYYYMMDD 后缀：${VERSION}"
            exit 1
          fi
          stamp="${VERSION##*-nightly.}"
          existing=""
          if gh release view nightly >/dev/null 2>&1; then
            existing="$(gh release view nightly --json name --jq '.name')"
          fi
          if [[ "${existing}" == *"${stamp}"* ]]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            echo "当天已有 ${existing}，原地更新资产与说明，不产生新的发布通知"
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "当天还没有 nightly 预发布（现有：${existing:-无}），删除旧的再重新发布"
          fi

      - name: Remove previous nightly release
        if: ${{ steps.nightly_state.outputs.reuse != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "nightly 预发布尚不存在，无需清理"
            exit 0
          fi
          gh release delete nightly --yes --cleanup-tag
          echo "已删除旧的 nightly 预发布与标签"

      - name: Publish Nightly Build pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          # 同一天复用同一个预发布时用它替换已存在的同名资产。
          overwrite_files: true
          make_latest: false
          files: |
            dist/JiYuAttackNext.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 复用当天的预发布时是原地更新，标签仍停在当天第一次构建的提交上，
      # 这里把它挪到本次提交，保证 nightly 标签与资产始终对应。
      - name: Point nightly tag at this build
        if: ${{ steps.nightly_state.outputs.reuse == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null; then
            echo "nightly 标签已指向 ${GITHUB_SHA}"
          else
            echo "::warning::nightly 标签未能移动，资产已是本次构建"
          fi
