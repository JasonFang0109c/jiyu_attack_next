name: Nightly Build

# 推送到 main 时，仅当改动会影响 EXE 产物才触发；
# 纯文档、测试等改动不重新编译。也可在 Actions 页面手动运行。
on:
  push:
    branches:
      - main
    paths:
      - "NeoJiYuTrainer/**"
      - "NeoJiYuTrainerUI/**"
      - "Pack/**"
      - "Scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nightly
    uses: ./.github/workflows/Build.yml
    with:
      channel: nightly
      # 预发布只放正常版本，调试版本没有发布渠道，不必编译。
      variants: release

  release:
    name: Publish Nightly Build
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          # 发布说明要读「本次构建提交」的说明，它往往不是 tip，浅克隆取不到。
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: NeoJiYuTrainer-build
          path: dist

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DISPLAY: ${{ needs.build.outputs.display }}
          BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          # 预发布只放正常版本：调试版本仍在本次 Actions 运行的产物里，
          # 需要时从运行页面下载，不再和正式产物混在同一个发布里。
          exe_path="dist/NeoJiYuTrainer-${DISPLAY}.exe"
          if [[ ! -f "${exe_path}" ]]; then
            echo "::error::未找到发布资产：${exe_path}"
            exit 1
          fi
          exe_sha256="$(sha256sum "${exe_path}" | awk '{print $1}')"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          short_sha="${BUILD_COMMIT::7}"
          commit_list="$(git log -1 --pretty=format:"- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${BUILD_COMMIT}")"
          cat > release-notes.md <<EOF
          # Nightly Build ${VERSION}

          - **Version:** \`${VERSION}\`
          - **Built at:** \`${built_at}\`
          - **Commit:** [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${BUILD_COMMIT})
          - **Workflow run:** [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Assets

          - \`NeoJiYuTrainer-${DISPLAY}.exe\`（正常版本；调试版本只在本次 Actions 运行的产物里）

          ## SHA256

          - EXE: \`${exe_sha256}\`

          ## Commits

          ${commit_list}

          EOF

      # 同一天只更新同一个预发布，跨天才删除重建：删除重建会触发一次新的
      # release 事件，仓库关注者的动态会被每日一次而不是每次推送刷屏。
      - name: Decide whether to reuse today's nightly release
        id: nightly_state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${VERSION}" != *-nightly.* ]]; then
            echo "::error::nightly 版本号缺少 -nightly.YYYYMMDD 后缀：${VERSION}"
            exit 1
          fi
          stamp="${VERSION##*-nightly.}"
          existing=""
          if gh release view nightly >/dev/null 2>&1; then
            existing="$(gh release view nightly --json name --jq '.name')"
          fi
          if [[ "${existing}" == *"${stamp}"* ]]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            echo "当天已有 ${existing}，原地更新资产与说明，不产生新的发布通知"
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "当天还没有 nightly 预发布（现有：${existing:-无}），删除旧的再重新发布"
          fi

      - name: Remove previous nightly release
        if: ${{ steps.nightly_state.outputs.reuse != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "nightly 预发布尚不存在，无需清理"
            exit 0
          fi
          gh release delete nightly --yes --cleanup-tag
          echo "已删除旧的 nightly 预发布与标签"

      - name: Publish Nightly Build pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          target_commitish: ${{ needs.build.outputs.build_commit }}
          fail_on_unmatched_files: true
          # 资产名带提交哈希，同名才会被替换；清理交给下一步。
          overwrite_files: true
          make_latest: false
          files: |
            dist/NeoJiYuTrainer-${{ needs.build.outputs.display }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 资产名带提交哈希，每次构建都是新名字；一旦有旧运行留下的资产或并发
      # 运行补传，发布页会同时出现多个提交、多个版本的 EXE。这里只保留本次
      # 构建的那一个文件，其余一律删除，保证发布页始终只有一个指向最新产物的资产。
      - name: Prune unexpected nightly assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED: NeoJiYuTrainer-${{ needs.build.outputs.display }}.exe
        run: |
          set -euo pipefail
          for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
            if [[ "${asset}" != "${EXPECTED}" ]]; then
              gh release delete-asset nightly "${asset}" --yes
              echo "已删除多余资产：${asset}"
            fi
          done

      # 复用当天的预发布时是原地更新，标签仍停在当天第一次构建的提交上，
      # 这里把它挪到本次构建的提交，保证 nightly 标签与资产始终对应。
      - name: Point nightly tag at this build
        if: ${{ steps.nightly_state.outputs.reuse == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          if gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            -f sha="${BUILD_COMMIT}" -F force=true >/dev/null; then
            echo "nightly 标签已指向 ${BUILD_COMMIT}"
          else
            echo "::warning::nightly 标签未能移动，资产已是本次构建"
          fi
