name: Build

# 可复用构建流程：nightly 与正式版发布共用，避免两处重复维护打包步骤。
on:
  workflow_call:
    inputs:
      channel:
        description: 构建通道，nightly 会在版本号后追加 -nightly.YYYYMMDD
        type: string
        required: false
        default: stable
      version:
        description: 显式指定版本号；留空时读取 app/core/constants.py 的 __version__
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: 本次打包使用的版本号，含 nightly 日期、不含提交哈希
        value: ${{ jobs.build.outputs.version }}
      base:
        description: 不带 nightly 日期的基础版本号，测试版的显示版本从它拼出
        value: ${{ jobs.build.outputs.base }}
      display:
        description: 产物与界面显示的版本号，测试版带提交哈希
        value: ${{ jobs.build.outputs.display }}

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
      display: ${{ steps.version.outputs.display }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          if (-not $version) {
            $version = (& .\.venv\Scripts\python.exe -X utf8 -c "import app; print(app.__version__)").Trim()
          }
          # 基础版本号用于产物名与界面显示；带日期的版本号只进标签、标题与发布说明。
          $base = $version
          if ($env:INPUT_CHANNEL -eq "nightly") {
            $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $version = "$version-nightly.$stamp"
          }
          # 测试版在基础版本号后追加提交哈希，得到 0.1.0-1a8ede3 这样的显示版本；
          # 产物文件名、EXE 版本资源与界面都用它，发布说明只写带日期的版本号。
          $commit = ""
          $display = $version
          if ($env:INPUT_CHANNEL -eq "nightly") {
            $commit = $env:GITHUB_SHA.Substring(0, 7)
            $display = "$base-$commit"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "display=$display" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "打包版本：$display"

      - name: Run offline checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m unittest discover -s tests -v
          .\.venv\Scripts\python.exe -X utf8 -m compileall -q app tests

      - name: Build EXE
        shell: pwsh
        run: |
          # 一次构建同时产出正常版本与 _Debug 版本，两者只差日志等级。
          powershell -ExecutionPolicy Bypass -File .\packaging\build.ps1 -Clean `
            -Variant both -Version "${{ steps.version.outputs.base }}" `
            -Commit "${{ steps.version.outputs.commit }}"

      - name: Prepare release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.display }}
        run: |
          $names = @("JiYuAttackNext", "JiYuAttackNext_Debug")
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          foreach ($name in $names) {
            # 构建脚本只写带显示版本的文件名，发布资产再按需要补固定名副本。
            $exeSource = "output\$name-$env:VERSION.exe"
            if (-not (Test-Path -LiteralPath $exeSource -PathType Leaf)) {
              throw "未找到构建产物：$exeSource"
            }
            Copy-Item -LiteralPath $exeSource -Destination "dist\$name.exe" -Force
            Copy-Item -LiteralPath $exeSource -Destination "dist\$name-$env:VERSION.exe" -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: JiYuAttackNext-build
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
